<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>C.N. Message</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #05050a;
    color: white;
    min-height: 100vh;
    height: 100vh;
    overflow: hidden; /* Empêche le body de défiler : seules les zones internes scrollent */
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   APPLICATION
========================= */

.app {
    width: 100%;
    max-width: 1000px;
    margin: auto;
    min-height: 100vh;
    background: #090914;
}

/* =========================
   BARRE DU HAUT
========================= */

.top {
    height: 64px;
    padding: 12px 16px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid #272052;
    background: #0d0d1a;

    position: sticky;
    top: 0;
    z-index: 50;
}

.logo {
    font-size: 20px;
    font-weight: 800;

    color: #00f0ff;

    text-shadow:
        0 0 8px #361FDB;
}

.status {
    font-size: 12px;
    color: #8d8da8;
}

/* =========================
   STRUCTURE
========================= */

.layout {
    display: grid;
    grid-template-columns: 290px 1fr;

    /* On occupe la hauteur restante sous la top bar */
    min-height: calc(100vh - 64px);
    height: calc(100vh - 64px);
}

/* =========================
   MENU GAUCHE
========================= */

.sidebar {
    border-right: 1px solid #272052;

    background: #0b0b17;

    padding: 12px;

    /* Par défaut la sidebar ne doit pas défiler avec le body */
    overflow: auto;
}

.tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
}

.tab {
    flex: 1;

    padding: 9px 5px;

    background: #121226;

    border: 1px solid #30277d;
    color: #aaa;

    border-radius: 7px;
}

.tab.active {
    background: #361FDB;
    color: white;
}

.search {
    width: 100%;

    padding: 11px;

    background: #05050a;
    color: white;

    border: 1px solid #30277d;
    border-radius: 7px;

    outline: none;

    margin-bottom: 10px;
}

.search:focus {
    border-color: #00f0ff;
}

.list {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.item {
    padding: 10px;

    border: 1px solid transparent;
    border-radius: 8px;

    background: #101021;

    text-align: left;

    color: white;
}

.item:hover,
.item.active {
    border-color: #361FDB;
    background: #171734;
}

.item-title {
    font-weight: bold;
}

.item-sub {
    font-size: 11px;
    color: #8585a5;

    margin-top: 3px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* =========================
   CHAT
========================= */

.chat {
    display: flex;
    flex-direction: column;

    /* IMPORTANT : on fixe la hauteur du conteneur chat et on cache son overflow
       afin que seules les messages scrollent. */
    min-height: calc(100vh - 64px);
    height: calc(100vh - 64px);
    overflow: hidden;
}

.chat-head {
    padding: 14px 16px;

    border-bottom: 1px solid #272052;

    background: #0d0d1a;

    /* Rendre le header du chat collant au sommet du conteneur chat */
    position: sticky;
    top: 0;
    z-index: 10;
}

.chat-name {
    font-weight: 800;
}

.chat-sub {
    font-size: 11px;

    color: #77779a;

    margin-top: 3px;
}

.messages {
    /* c'est la seule zone qui défile */
    flex: 1;

    overflow-y: auto;

    padding: 16px;

    background: #05050a;
}

/* =========================
   MESSAGES
========================= */

.message {
    max-width: 78%;

    margin-bottom: 10px;

    padding: 9px 11px;

    border-radius: 10px;

    background: #101021;

    border-left: 3px solid #361FDB;
}

.message.mine {
    margin-left: auto;

    background: #15113a;

    border-left: 0;
    border-right: 3px solid #00f0ff;
}

.meta {
    font-size: 11px;

    color: #00f0ff;

    margin-bottom: 3px;
}

.text {
    white-space: pre-wrap;

    word-break: break-word;
}

.time {
    font-size: 9px;

    color: #666680;

    text-align: right;

    margin-top: 4px;
}

/* =========================
   ZONE D'ENVOI
========================= */

.composer {
    padding: 12px;

    border-top: 1px solid #272052;

    background: #0d0d1a;

    display: flex;

    gap: 7px;

    /* Faire rester la barre d'envoi en bas du conteneur chat */
    position: sticky;
    bottom: 0;
    z-index: 10;
}

.composer input {
    flex: 1;

    min-width: 0;

    padding: 12px;

    background: #05050a;

    color: white;

    border: 1px solid #30277d;

    border-radius: 8px;

    outline: none;
}

.composer input:focus {
    border-color: #00f0ff;
}

.send {
    padding: 12px 15px;

    background: #361FDB;

    border: 0;

    color: white;

    border-radius: 8px;

    font-weight: bold;
}

/* =========================
   CONNEXION
========================= */

.login {
    min-height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;
}

.loginbox {
    width: 100%;

    max-width: 500px;

    background: #0d0d1a;

    padding: 24px;

    border-radius: 14px;

    border: 2px solid #361FDB;

    box-shadow:
        0 0 20px rgba(54,31,219,.25);
}

.loginbox h1 {
    color: #00f0ff;
}

.loginbox p {
    color: #aaa;
}

.loginbox input {
    width: 100%;

    padding: 13px;

    background: #05050a;

    color: white;

    border: 1px solid #361FDB;

    border-radius: 7px;

    margin: 8px 0 12px;

    outline: none;
}

.primary {
    width: 100%;

    padding: 13px;

    background: #002FA7;

    color: white;

    border: 1px solid #00f0ff;

    border-radius: 7px;

    font-weight: bold;
}

.me {
    padding: 10px;

    margin-bottom: 10px;

    background: #101021;

    border-radius: 8px;

    border: 1px solid #29245a;

    font-size: 12px;
}

.empty {
    color: #77779a;

    text-align: center;

    padding: 30px 10px;
}

.error {
    color: #ff7373;

    font-size: 13px;

    margin-top: 8px;
}

.hidden {
    display: none !important;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    /* Sur mobile on masque la sidebar par défaut ; on l'ouvre via le bouton menu */
    .layout {
        grid-template-columns: 1fr;
        height: calc(100vh - 64px);
    }

    .sidebar {
        display: none;
        position: fixed;
        left: 0;
        top: 64px; /* sous la top bar */
        bottom: 0;
        width: 290px;
        z-index: 60;
        box-shadow: 0 8px 30px rgba(0,0,0,.6);
    }

    /* Quand on ajoute la classe .open à la sidebar, elle devient visible en overlay */
    .sidebar.open {
        display: block;
        background: #0b0b17;
    }

    .chat {
        min-height: 65vh;
    }

    .messages {
        min-height: 300px;
    }

    .item {
        padding: 8px;
    }
}
</style>
</head>

<body>

<!-- =========================
     ÉCRAN DE CONNEXION
========================= -->

<div id="login" class="login">

    <div class="loginbox">

        <h1>💬 C.N. Message</h1>

        <p>
            Crée ton identité réseau.
            Ton pseudo sera accompagné d'un identifiant unique.
        </p>

        <input
            id="pseudo"
            maxlength="24"
            autocomplete="off"
            autocapitalize="none"
            placeholder="Ex : Alexis"
        >

        <button
            class="primary"
            id="createBtn"
        >
            Initialiser la connexion
        </button>

        <div
            id="loginError"
            class="error"
        ></div>

    </div>

</div>


<!-- =========================
     APPLICATION
========================= -->

<div
    id="app"
    class="app hidden"
>
    <!-- BARRE DU HAUT -->

    <header class="top">

        <div class="logo">
            💬 C.N. Message
        </div>

        <div style="display:flex;align-items:center;gap:10px;">
    <div id="status" class="status">
        Connexion…
    </div>

    <!-- Bouton menu pour afficher/masquer la sidebar sur mobile -->
    <button
        id="menuBtn"
        style="
            background:#121226;
            border:1px solid #361FDB;
            color:white;
            border-radius:8px;
            padding:8px 10px;

        "
    >☰</button>

    <button
        id="settingsBtn"
        style="
            background:#121226;
            border:1px solid #361FDB;
            color:white;
            border-radius:8px;
            padding:8px 10px;
            font-size:18px;
        "
    >⚙️</button>
</div>

    </header>


    <div class="layout">

        <!-- =========================
             MENU
        ========================= -->

        <aside class="sidebar">

            <div
                id="me"
                class="me"
            ></div>


            <div class="tabs">

                <button
                    id="worldTab"
                    class="tab active"
                >
                    🌍 Mondial
                </button>

                <button
                    id="dmTab"
                    class="tab"
                >
                    💬 Privé
                </button>

            </div>


            <input
                id="search"
                class="search"
                placeholder="Rechercher un utilisateur…"
            >


            <div
                id="list"
                class="list"
            ></div>

        </aside>


        <!-- =========================
             CHAT
        ========================= -->

        <main class="chat">

            <div class="chat-head">

                <div
                    id="chatName"
                    class="chat-name"
                >
                    🌍 Mondial
                </div>

                <div
                    id="chatSub"
                    class="chat-sub"
                >
                    Tout le réseau
                </div>

            </div>


            <div
                id="messages"
                class="messages"
            ></div>


            <div class="composer">

                <input
                    type="text"
                    id="messageInput"
                    maxlength="2000"
                    placeholder="Écris ton message…"
                >

                <button
                    id="sendBtn"
                    class="send"
                >
                    Envoyer
                </button>

            </div>

        </main>

    </div>

</div>

<!-- =========================
     PARAMÈTRES
========================= -->

<div
    id="settingsPanel"
    class="hidden"
    style="
        position:fixed;
        inset:0;

        background:rgba(0,0,0,.75);
        padding:20px;
        overflow-y:auto;
    "
>

    <div
        style="
            max-width:500px;

            background:#0d0d1a;

    >

        <div
            style="
                display:flex;

                margin-bottom:20px;
            "
        >

            <h2 style="margin:0;color:#00f0ff;">
                ⚙️ Paramètres
            </h2>

            <button
                id="closeSettings"
                style="
                    background:#121226;
                    border:1px solid #361FDB;
                    color:white;
                    border-radius:7px;
                    padding:7px 10px;
                "
            >✕</button>

        </div>


        <!-- PROFIL -->

        <h3 style="color:#00f0ff;">
            👤 Profil
        </h3>

        <label>
            Pseudo
        </label>

        <input
            id="settingsPseudo"
            type="text"
            maxlength="24"
            style="
                width:100%;
                padding:12px;
                margin-top:6px;
                background:#05050a;
                color:white;
                border:1px solid #30277d;

            "
        >


        <label style="display:block;margin-top:15px;">
            Photo de profil — lien de l'image
        </label>

        <input
            id="settingsAvatar"
            type="url"

            style="
                width:100%;

        >

        <p

                color:#77779a;

        </p>


        <img
            id="avatarPreview"

            style="
                width:70px;

                object-fit:cover;
                border:2px solid #00f0ff;
                background:#361FDB;
                display:none;
                margin:10px 0;
            "
        >


        <!-- APPARENCE -->

        <h3 style="color:#00f0ff;margin-top:25px;">
            🎨 Apparence
        </h3>

        <div style="display:flex;gap:8px;">

            <button
                id="darkModeBtn"
                style="
                    flex:1;
                    padding:12px;
                    background:#121226;
                    color:white;
                    border:1px solid #361FDB;
                    border-radius:7px;
                "
            >
                🌙 Sombre
            </button>

            <button
                id="lightModeBtn"
                style="
                    flex:1;
                    padding:12px;
                    background:#121226;
                    color:white;
                    border:1px solid #361FDB;
                    border-radius:7px;
                "
            >
                ☀️ Clair
            </button>

        </div>


        <button
            id="saveSettings"
            style="
                width:100%;
                margin-top:25px;
                padding:13px;
                background:#361FDB;
                color:white;
                border:0;
                border-radius:8px;
                font-weight:bold;
            "
        >
            💾 Enregistrer
        </button>

        <div
            id="settingsMessage"
            style="
                margin-top:10px;
                text-align:center;
                color:#00f0ff;
                font-size:13px;
            "
        ></div>

    </div>

</div>
<!-- =========================
     JAVASCRIPT
========================= -->

/* =========================

function escapeText(value) {

    return String(value ?? "");

}



/* =========================
   AUTHENTIFICATION
========================= */

async function ensureAuth() {

    let {
        data: {
            session
        }
    } =
        await supabase.auth.getSession();


    if (!session) {

        const {
            data,
            error
        } =
            await supabase.auth.signInAnonymously();


        if (error)
            throw error;


        session = data.session;

    }


    user = session.user;

}



/* =========================
   CHARGER PROFIL
========================= */

async function loadProfile() {

    const {
        data,
        error
    } =
        await supabase
            .from("profiles")
            .select("*")
            .eq("id", user.id)
            .single();


    if (error)
        throw error;


    profile = data;


    $("me").innerHTML =

        `<b>${escapeText(profile.pseudo)}</b>
        <span style="color:#361FDB">
        #${profile.network_id}
        </span>`;

}

[...]

// =========================
// SIDEBAR / LAYOUT HELPERS
// =========================

// toggle sidebar open/close (mobile)
const menuBtn = $("menuBtn");
const sidebarEl = document.querySelector('.sidebar');

if (menuBtn) {
    menuBtn.addEventListener('click', () => {
        if (!sidebarEl) return;
        sidebarEl.classList.toggle('open');
    });
}

// close sidebar when clicking outside (mobile)
document.addEventListener('click', (e) => {
    if (!sidebarEl) return;
    if (!sidebarEl.classList.contains('open')) return;

    // si on clique sur le bouton menu ou la sidebar, ne rien faire
    const path = e.composedPath ? e.composedPath() : (e.path || []);
    if (path.includes(menuBtn) || path.includes(sidebarEl)) return;

    sidebarEl.classList.remove('open');
});

// Assurer que la sidebar est visible automatiquement sur grand écran
window.addEventListener('resize', () => {
    if (!sidebarEl) return;
    if (window.innerWidth > 700) {
        sidebarEl.classList.remove('open');
        sidebarEl.style.display = '';
    } else {
        // sur mobile, par défaut on cache la sidebar
        sidebarEl.style.display = '';
    }
});
// démarrer l'app
init().catch(err => {
  console.error('init error', err);
  const el = document.getElementById('loginError');
  if (el) el.textContent = err?.message || String(err);
});
</script>
