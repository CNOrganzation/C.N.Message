<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>C.N. Message</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #05050a;
    color: white;
    min-height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   APPLICATION
========================= */

.app {
    width: 100%;
    max-width: 1000px;
    margin: auto;
    min-height: 100vh;
    background: #090914;
}

/* =========================
   BARRE DU HAUT
========================= */

.top {
    height: 64px;
    padding: 12px 16px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid #272052;
    background: #0d0d1a;

    position: sticky;
    top: 0;
    z-index: 5;
}

.logo {
    font-size: 20px;
    font-weight: 800;

    color: #00f0ff;

    text-shadow:
        0 0 8px #361FDB;
}

.status {
    font-size: 12px;
    color: #8d8da8;
}

.menuBtn {
    display: none;

    background: #121226;
    border: 1px solid #361FDB;
    color: white;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 18px;
}

/* =========================
   STRUCTURE
========================= */

.layout {
    display: grid;
    grid-template-columns: 290px 1fr;

    height: calc(100vh - 64px);
    min-height: 0;
}

/* =========================
   MENU GAUCHE
========================= */

.sidebar {
    border-right: 1px solid #272052;

    background: #0b0b17;

    padding: 12px;

    overflow-y: auto;
}

.sidebarClose {
    display: none;
}

.tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
}

.tab {
    flex: 1;

    padding: 9px 5px;

    background: #121226;

    border: 1px solid #30277d;
    color: #aaa;

    border-radius: 7px;
}

.tab.active {
    background: #361FDB;
    color: white;
}

.search {
    width: 100%;

    padding: 11px;

    background: #05050a;
    color: white;

    border: 1px solid #30277d;
    border-radius: 7px;

    outline: none;

    margin-bottom: 10px;
}

.search:focus {
    border-color: #00f0ff;
}

.list {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.item {
    padding: 10px;

    border: 1px solid transparent;
    border-radius: 8px;

    background: #101021;

    text-align: left;

    color: white;
}

.item:hover,
.item.active {
    border-color: #361FDB;
    background: #171734;
}

.item-title {
    font-weight: bold;
}

.item-sub {
    font-size: 11px;
    color: #8585a5;

    margin-top: 3px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.conversation-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
}

.conversation-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #361FDB;
    background: #361FDB;
    flex-shrink: 0;
}

.conversation-info {
    min-width: 0;
    flex: 1;
}

.conversation-top {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
}

.conversation-time {
    font-size: 10px;
    color: #77779a;
    flex-shrink: 0;
}

/* =========================
   CHAT
========================= */

.chat {
    display: flex;
    flex-direction: column;

    height: 100%;
    min-height: 0;
}

.chat-head {
    padding: 14px 16px;

    border-bottom: 1px solid #272052;

    background: #0d0d1a;

    display: flex;
    align-items: center;
    gap: 10px;

    flex-shrink: 0;
}

.chat-avatar {
    width: 38px;
    height: 38px;

    border-radius: 50%;

    object-fit: cover;

    border: 2px solid #361FDB;

    background: #361FDB;

    flex-shrink: 0;
}

.chat-head-info {
    min-width: 0;
}

.chat-name {
    font-weight: 800;
}

.chat-sub {
    font-size: 11px;

    color: #77779a;

    margin-top: 3px;
}

.messages {
    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 16px;

    background: #05050a;
}

/* =========================
   MESSAGES
========================= */
.message-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background: #252538;
}

.meta {
    display: flex;
    align-items: center;
    gap: 8px;
}
.message {
    max-width: 78%;

    margin-bottom: 10px;

    padding: 9px 11px;

    border-radius: 10px;

    background: #101021;

    border-left: 3px solid #361FDB;
}

.message.mine {
    margin-left: auto;

    background: #15113a;

    border-left: 0;
    border-right: 3px solid #00f0ff;
}

.meta {
    font-size: 11px;

    color: #00f0ff;

    margin-bottom: 3px;
}

.text {
    white-space: pre-wrap;

    word-break: break-word;
}

.time {
    font-size: 9px;

    color: #666680;

    text-align: right;

    margin-top: 4px;
}

/* =========================
   ZONE D'ENVOI
========================= */

.composer {
    padding: 12px;

    border-top: 1px solid #272052;

    background: #0d0d1a;

    display: flex;

    gap: 7px;

    flex-shrink: 0;
}

.composer input {
    flex: 1;

    min-width: 0;

    padding: 12px;

    background: #05050a;

    color: white;

    border: 1px solid #30277d;

    border-radius: 8px;

    outline: none;
}

.composer input:focus {
    border-color: #00f0ff;
}

.send {
    padding: 12px 15px;

    background: #361FDB;

    border: 0;

    color: white;

    border-radius: 8px;

    font-weight: bold;
}


.attachment {
    padding: 12px 13px;
    background: #121226;
    border: 1px solid #361FDB;
    color: white;
    border-radius: 8px;
    font-size: 18px;
    flex-shrink: 0;
}

.attachment:hover {
    border-color: #00f0ff;
}

.attachment-name {
    font-size: 10px;
    color: #77779a;
    margin-top: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.message-image {
    display: block;
    max-width: 100%;
    max-height: 320px;
    margin-top: 8px;
    border-radius: 8px;
    border: 1px solid #30277d;
    object-fit: contain;
}

/* =========================
   CONNEXION
========================= */

.login {
    min-height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;
}

.loginbox {
    width: 100%;

    max-width: 500px;

    background: #0d0d1a;

    padding: 24px;

    border-radius: 14px;

    border: 2px solid #361FDB;

    box-shadow:
        0 0 20px rgba(54,31,219,.25);
}

.loginbox h1 {
    color: #00f0ff;
}

.loginbox p {
    color: #aaa;
}

.loginbox input {
    width: 100%;

    padding: 13px;

    background: #05050a;

    color: white;

    border: 1px solid #361FDB;

    border-radius: 7px;

    margin: 8px 0 12px;

    outline: none;
}

.primary {
    width: 100%;

    padding: 13px;

    background: #002FA7;

    color: white;

    border: 1px solid #00f0ff;

    border-radius: 7px;

    font-weight: bold;
}

.me {
    padding: 10px;

    margin-bottom: 10px;

    background: #101021;

    border-radius: 8px;

    border: 1px solid #29245a;

    font-size: 12px;
}

.empty {
    color: #77779a;

    text-align: center;

    padding: 30px 10px;
}

.error {
    color: #ff7373;

    font-size: 13px;

    margin-top: 8px;
}

.hidden {
    display: none !important;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    .menuBtn {
        display: block;
    }

    .layout {
        display: block;

        height: calc(100vh - 64px);
        min-height: 0;
    }

    .sidebar {
        position: fixed;

        top: 64px;
        left: 0;
        bottom: 0;

        width: 290px;
        max-width: 85vw;

        z-index: 20;

        border-right: 1px solid #272052;
        border-bottom: 0;

        transform: translateX(-100%);
        transition: transform .2s ease;

        box-shadow: 8px 0 25px rgba(0,0,0,.45);
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .sidebarClose {
        display: block;

        width: 100%;

        margin-bottom: 10px;

        padding: 9px;

        background: #121226;
        border: 1px solid #361FDB;
        color: white;

        border-radius: 7px;

        text-align: left;
    }

    .chat {
        height: 100%;
        min-height: 0;
    }

    .messages {
        min-height: 0;
    }

    .item {
        padding: 8px;
    }
}
</style>
</head>

<body>

     ÉCRAN DE CONNEXION
========================= -->

<!-- =========================

<div

<!-- =========================
     JAVASCRIPT
========================= -->

<script type="module">

import {
    createClient
} from "https://esm.sh/@supabase/supabase-js@2";


/*
==========================================================
IMPORTANT

TU REMPLACERAS CES DEUX VALEURS APRÈS AVOIR CRÉÉ SUPABASE.

==========================================================
*/

const SUPABASE_URL = "https://kmeuxlqtwsgauajmwsav.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_bUgTtZXn7zfY3_y8fdL5zg_u675RwY1";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================
   VARIABLES
========================= */

let user = null;

let profile = null;

let currentMode = "world";

let currentUser = null;

let realtimeChannel = null;

const DEFAULT_AVATAR =
    "https://thumbs.dreamstime.com/b/fond-abstrait-avec-la-vague-bleue-30071626.jpg";


/* =========================
   RACCOURCI DOM
========================= */

const $ = id =>
    document.getElementById(id);


/* =========================
   PROTECTION TEXTE
========================= */

function escapeText(value) {

    return String(value ?? "");

}


/* =========================
   AUTHENTIFICATION
========================= */

async function ensureAuth() {

    let {
        data: {
            session
        }
    } =
        await supabase.auth.getSession();


    if (!session) {

        const {
            data,
            error
        } =
            await supabase.auth.signInAnonymously();


        if (error)
            throw error;


        session = data.session;

    }


    user = session.user;

}


/* =========================
   CHARGER PROFIL
========================= */

async function loadProfile() {

    const {
        data,
        error
    } =
        await supabase
            .from("profiles")
            .select("*")
            .eq("id", user.id)
            .single();


    if (error)
        throw error;


    profile = data;


    $("me").innerHTML =

        `<b>${escapeText(profile.pseudo)}</b>
        <span style="color:#361FDB">
        #${profile.network_id}
        </span>`;

}


/* =========================
   INITIALISATION
========================= */

async function init() {

    try {

        if (
            SUPABASE_URL.includes("COLLE_")
        ) {

            throw new Error(
                "Configure d'abord Supabase dans le fichier index.html."
            );

        }


        await ensureAuth();

        await loadProfile();


        $("login")
            .classList
            .add("hidden");


        $("app")
            .classList
            .remove("hidden");


        $("status").textContent =
            "   ● En ligne   ";


        await openWorld();


    }
    catch (e) {

        $("loginError").textContent =
            e.message ||
            "Erreur de connexion.";

    }

}


/* =========================
   CRÉER COMPTE
========================= */

async function createProfile() {

    const pseudo =
        $("pseudo")
            .value
            .trim();


    if (!pseudo) {

        $("loginError").textContent =
            "Pseudo obligatoire.";

        return;

    }


    if (
        !/^[A-Za-zÀ-ÿ0-9_ -]{2,24}$/
            .test(pseudo)
    ) {

        $("loginError").textContent =
            "Pseudo : 2 à 24 caractères, sans symbole spécial.";

        return;

    }


    $("createBtn").disabled = true;

    $("loginError").textContent = "";


    try {

        let {
            data: {
                session
            }
        } =
            await supabase
                .auth
                .getSession();


        if (!session) {

            const {
                data,
                error
            } =
                await supabase
                    .auth
                    .signInAnonymously();


            if (error)
                throw error;


            session =
                data.session;

        }


        user =
            session.user;


        const {
            data,
            error
        } =
            await supabase
                .rpc(
                    "create_profile",
                    {
                        p_pseudo: pseudo
                    }
                );


        if (error)
            throw error;


        profile = data;


        $("login")
            .classList
            .add("hidden");


        $("app")
            .classList
            .remove("hidden");


        $("me").innerHTML =

            `<b>${escapeText(profile.pseudo)}</b>
            <span style="color:#361FDB">
            #${profile.network_id}
            </span>`;


        $("status").textContent =
            "● En ligne";


        await openWorld();

    }
    catch (e) {

        $("loginError").textContent =
            e.message ||
            "Impossible de créer le profil.";


        $("createBtn").disabled =
            false;

    }

}


/* =========================
   AVATAR DISCUSSION
========================= */

function setChatAvatar(url) {

    const avatar =
        $("chatAvatar");


    const finalUrl =
        url || DEFAULT_AVATAR;


    avatar.src =
        finalUrl;

    avatar.style.display =
        "block";


    avatar.onerror = () => {

        avatar.onerror = null;

        avatar.src =
            DEFAULT_AVATAR;

    };

}


/* =========================
   AFFICHER LES MESSAGES
========================= */

function setMessages(rows) {

    $("messages").innerHTML = "";


    if (!rows?.length) {

        $("messages").innerHTML =
            '<div class="empty">Aucun message pour le moment.</div>';

        return;

    }


    for (const row of rows) {

        addMessage(row);

    }


    $("messages").scrollTop =
        $("messages").scrollHeight;

}


/* =========================
   AJOUTER UN MESSAGE
========================= */

function addMessage(row) {

    const empty =
        $("messages")
            .querySelector(".empty");


    if (empty)
        empty.remove();


    const div =
        document.createElement("div");


    div.className =
        "message" +
        (
            row.sender_id === user.id
                ? " mine"
                : ""
        );


    div.innerHTML =

        `<div class="meta">
            ${escapeText(
                row.sender?.pseudo ||
                (
                    row.sender_id === user.id
                        ? profile.pseudo
                        : "Utilisateur"
                )
            )}

            <span style="color:#55557a">
                #${row.sender?.network_id || ""}
            </span>
        </div>

        <div class="text"></div>

        <div class="time">
            ${new Date(
                row.created_at
            ).toLocaleTimeString(
                "fr-FR",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            )}
        </div>`;


    div.querySelector(".text")
        .textContent = row.body || "";


    if (row.attachment_url) {

        const image =
            document.createElement("img");

        image.className =
            "message-image";

        image.src =
            row.attachment_url;

        image.alt =
            "Photo jointe";

        image.loading =
            "lazy";

        image.onerror = () => {
            image.remove();
        };

        div.insertBefore(
            image,
            div.querySelector(".time")
        );

    }


    $("messages")
        .appendChild(div);

}

/* =========================
   OUVRIR MONDIAL
========================= */

async function openWorld() {

    currentMode =
        "world";

    currentUser =
        null;


    $("worldTab")
        .classList
        .add("active");


    $("dmTab")
        .classList
        .remove("active");


    $("chatName").textContent =
        "🌍 Mondial";


    $("chatSub").textContent =
        "Tout le réseau";


    setChatAvatar(null);


    closeSidebar();


    if (realtimeChannel) {

        await supabase
            .removeChannel(
                realtimeChannel
            );

    }


    const {
        data,
        error
    } =
        await supabase
            .from("world_messages")
            .select(
                "*,sender:profiles!world_messages_sender_id_fkey(pseudo,network_id,avatar_url)"
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            )
            .limit(200);


    if (error) {

        showError(error);

        return;

    }


    setMessages(data);


    /*
    ==============================================
    TEMPS RÉEL DU MONDIAL
    ==============================================
    */

    realtimeChannel =

        supabase
            .channel("world-live")

            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "world_messages"
                },

                async payload => {

                    const {
                        data
                    } =
                        await supabase
                            .from("world_messages")
                            .select(
                                "*,sender:profiles!world_messages_sender_id_fkey(pseudo,network_id,avatar_url)"
                            )
                            .eq(
                                "id",
                                payload.new.id
                            )
                            .single();


                    if (data) {

                        addMessage(data);

                        $("messages")
                            .scrollTop =
                            $("messages")
                                .scrollHeight;

                    }

                }

            )

            .subscribe();

}


/* =========================
   DISCUSSIONS RÉCENTES
========================= */

async function loadConversations() {

    const { data, error } =
        await supabase
            .rpc("get_private_conversations");

    if (error) {
        showError(error);
        return;
    }

    const list = $("list");
    list.innerHTML = "";

    for (const c of (data || [])) {

        const b = document.createElement("button");
        b.className = "item";

        b.innerHTML =
            `<div class="conversation-item">
                <img
                    class="conversation-avatar"
                    src="${c.avatar_url || DEFAULT_AVATAR}"
                    alt=""
                >
                <div class="conversation-info">
                    <div class="conversation-top">
                        <div class="item-title">
                            ${escapeText(c.pseudo)}
                        </div>
                        <div class="conversation-time">
                            ${c.last_message_at
                                ? new Date(c.last_message_at).toLocaleDateString("fr-FR", {day:"2-digit", month:"2-digit"})
                                : ""}
                        </div>
                    </div>
                    <div class="item-sub">
                        ${escapeText(c.last_message || "📷 Photo")}
                    </div>
                </div>
            </div>`;

        const avatar = b.querySelector(".conversation-avatar");
        avatar.onerror = () => avatar.src = DEFAULT_AVATAR;

        b.onclick = () => openDM(c);
        list.appendChild(b);
    }

    if (!data || !data.length) {
        list.innerHTML =
            '<div class="empty">Aucune discussion récente.</div>';
    }
}


/* =========================
   RECHERCHE UTILISATEURS
========================= */

async function searchUsers() {

    const q =
        $("search")
            .value
            .trim();


    $("list").innerHTML = "";


    if (
        currentMode === "dm" &&
        !q
    ) {
        await loadConversations();
        return;
    }


    if (
        currentMode === "world"
    ) {

        if (!q) {

            $("list").innerHTML =
                '<div class="empty">Passe en 💬 Privé pour rechercher un utilisateur.</div>';

            return;

        }

    }


    if (!q)
        return;


    const {
        data,
        error
    } =
        await supabase
            .from("profiles")
            .select(
                "id,pseudo,network_id,avatar_url"
            )
            .neq(
                "id",
                user.id
            )
            .or(
                `pseudo.ilike.%${q}%,network_id.eq.${Number(q) || 0}`
            )
            .limit(20);


    if (error)
        return;


    for (const p of data) {

        const b =
            document.createElement("button");


        b.className =
            "item";


        b.innerHTML =

            `<div class="item-title">
                ${escapeText(p.pseudo)}
            </div>

            <div class="item-sub">
                #${p.network_id}
            </div>`;


        b.onclick =
            () => openDM({
    id: p.user_id,
    pseudo: p.pseudo,
    network_id: p.network_id,
    avatar_url: p.avatar_url
});


        $("list")
            .appendChild(b);

    }


    if (!data.length) {

        $("list").innerHTML =
            '<div class="empty">Aucun utilisateur trouvé.</div>';

    }

}


/* =========================
   OUVRIR DISCUSSION PRIVÉE
========================= */

async function openDM(other) {

    /* =========================
       SÉCURISER L'UTILISATEUR
    ========================= */

    const otherId =
        other.id ||
        other.user_id ||
        other.other_user_id ||
        other.receiver_id;

    if (!otherId) {

        showError({
            message:
                "Impossible d'ouvrir cette discussion : identifiant du destinataire introuvable."
        });

        return;

    }


    /* =========================
       RÉCUPÉRER LE PROFIL COMPLET
    ========================= */

    let otherProfile = other;

    if (!otherProfile.id) {

        const {
            data,
            error
        } =
            await supabase
                .from("profiles")
                .select(
                    "id,pseudo,network_id,avatar_url"
                )
                .eq(
                    "id",
                    otherId
                )
                .single();

        if (error) {

            showError(error);

            return;

        }

        otherProfile = data;

    }


    currentMode =
        "dm";

    currentUser =
        otherProfile;


    $("worldTab")
        .classList
        .remove("active");


    $("dmTab")
        .classList
        .add("active");


    $("chatName").textContent =
        `💬 ${otherProfile.pseudo}`;


    $("chatSub").textContent =
        `${otherProfile.pseudo} #${otherProfile.network_id}`;


    setChatAvatar(
        otherProfile.avatar_url
    );


    closeSidebar();


    if (realtimeChannel) {

        await supabase
            .removeChannel(
                realtimeChannel
            );

    }


    /* =========================
       CHARGER L'HISTORIQUE
    ========================= */

    const {
        data,
        error
    } =
        await supabase
            .rpc(
                "get_private_messages",
                {
                    other_user_id:
                        otherProfile.id
                }
            );


    if (error) {

        showError(error);

        return;

    }


    const formatted =
        (data || []).map(row => ({

            id:
                row.id,

            sender_id:
                row.sender_id,

            receiver_id:
                row.receiver_id,

            body:
                row.body,

            created_at:
                row.created_at,

            sender: {

                pseudo:
                    row.pseudo,

                network_id:
                    row.network_id,

                avatar_url:
                    row.avatar_url

            }

        }));


    setMessages(formatted);


    /* =========================
       TEMPS RÉEL
    ========================= */

    realtimeChannel =

        supabase
            .channel(
                "dm-" +
                [user.id, otherProfile.id]
                    .sort()
                    .join("-")
            )

            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "private_messages"
                },

                async payload => {

                    const r =
                        payload.new;


                    if (

                        (
                            r.sender_id === user.id &&
                            r.receiver_id === otherProfile.id
                        )

                        ||

                        (
                            r.sender_id === otherProfile.id &&
                            r.receiver_id === user.id
                        )

                    ) {

                        const {
                            data
                        } =
                            await supabase
                                .from("private_messages")
                                .select(
                                    "*,sender:profiles!private_messages_sender_id_fkey(pseudo,network_id,avatar_url)"
                                )
                                .eq(
                                    "id",
                                    r.id
                                )
                                .single();


                        if (data) {

                            addMessage(data);

                            $("messages")
                                .scrollTop =
                                $("messages")
                                    .scrollHeight;

                        }

                    }

                }

            )

            .subscribe();

}

/* =========================
   ENVOYER MESSAGE
========================= */

async function sendMessage() {

    const body =
        $("messageInput")
            .value
            .trim();

    const file =
        $("attachmentInput")
            .files[0];


    if (!body && !file)
        return;


    $("sendBtn")
        .disabled = true;

    $("attachmentBtn")
        .disabled = true;


    try {

        let attachmentUrl = null;
        let attachmentType = null;


        /*
        ==========================================
        UPLOAD DE LA PHOTO
        ==========================================
        */

        if (file) {

            if (!file.type.startsWith("image/")) {
                throw new Error(
                    "Pour le moment, seules les photos sont acceptées."
                );
            }


            if (file.size > 10 * 1024 * 1024) {
                throw new Error(
                    "La photo est trop lourde. Maximum : 10 Mo."
                );
            }


            const extension =
                file.name.split(".").pop() || "jpg";

            const filePath =
                user.id +
                "/" +
                crypto.randomUUID() +
                "." +
                extension;


            const {
                error: uploadError
            } =
                await supabase.storage
                    .from("attachments")
                    .upload(
                        filePath,
                        file,
                        {
                            contentType: file.type,
                            upsert: false
                        }
                    );


            if (uploadError)
                throw uploadError;


            const {
                data: publicData
            } =
                supabase.storage
                    .from("attachments")
                    .getPublicUrl(filePath);


            attachmentUrl =
                publicData.publicUrl;

            attachmentType =
                file.type;

        }


        /*
        ==============================
        MONDIAL
        ==============================
        */

        if (
            currentMode === "world"
        ) {

            const {
                error
            } =
                await supabase
                    .from("world_messages")
                    .insert({
                        sender_id:
                            user.id,

                        body:
                            body,

                        attachment_url:
                            attachmentUrl,

                        attachment_type:
                            attachmentType
                    });


            if (error)
                throw error;

        }


        /*
        ==============================
        MESSAGE PRIVÉ
        ==============================
        */

        else {

            const {
                error
            } =
                await supabase
                    .from("private_messages")
                    .insert({

                        sender_id:
                            user.id,

                        receiver_id:
                            currentUser.id,

                        body:
                            body,

                        attachment_url:
                            attachmentUrl,

                        attachment_type:
                            attachmentType

                    });


            if (error)
                throw error;

        }


        $("messageInput")
            .value = "";

        if (currentMode === "dm") {
            loadConversations();
        }

        $("attachmentInput")
            .value = "";

        $("attachmentName")
            .textContent = "";

    }
    catch (e) {

        showError(e);

    }


    $("sendBtn")
        .disabled = false;

    $("attachmentBtn")
        .disabled = false;

}

/* =========================

/* =========================
   PARAMÈTRES
========================= */

const settingsPanel =
    $("settingsPanel");

const settingsPseudo =
    $("settingsPseudo");

const settingsAvatar =
    $("settingsAvatar");

const avatarPreview =
    $("avatarPreview");


/* OUVRIR */

$("settingsBtn").onclick = () => {

    settingsPseudo.value =
        profile.pseudo;

    settingsAvatar.value =
        profile.avatar_url || "";

    updateAvatarPreview();

    settingsPanel
        .classList
        .remove("hidden");

};


/* FERMER */

$("closeSettings").onclick = () => {

    settingsPanel
        .classList
        .add("hidden");

};


/* APERÇU PDP */

function updateAvatarPreview() {

    const url =
        settingsAvatar.value.trim();


    if (!url) {

        avatarPreview.style.display =
            "none";

        return;

    }


    avatarPreview.src =
        url;

    avatarPreview.style.display =
        "block";

}


settingsAvatar
    .addEventListener(
        "input",
        updateAvatarPreview
    );


/* =========================
   ENREGISTRER PROFIL
========================= */

$("saveSettings").onclick =
    async () => {

        const pseudo =
            settingsPseudo.value.trim();

        const avatar =
            settingsAvatar.value.trim();


        if (!pseudo) {

            $("settingsMessage")
                .textContent =
                "❌ Le pseudo est obligatoire.";

            return;

        }


        if (
            pseudo.length < 2 ||
            pseudo.length > 24
        ) {

            $("settingsMessage")
                .textContent =
                "❌ Le pseudo doit faire 2 à 24 caractères.";

            return;

        }


        $("saveSettings")
            .disabled = true;


        try {

            const {
                error
            } =
                await supabase
                    .from("profiles")
                    .update({

                        pseudo:
                            pseudo,

                        avatar_url:
                            avatar || null

                    })
                    .eq(
                        "id",
                        user.id
                    );


            if (error)
                throw error;


            /*
            Met à jour le profil local
            */

            profile.pseudo =
                pseudo;

            profile.avatar_url =
                avatar || null;


            /*
            Met à jour l'affichage
            */

            $("me").innerHTML =

                `<b>${escapeText(profile.pseudo)}</b>
                <span style="color:#361FDB">
                #${profile.network_id}
                </span>`;


            $("settingsMessage")
                .textContent =
                "✅ Profil enregistré !";


            setTimeout(() => {

                settingsPanel
                    .classList
                    .add("hidden");

                $("settingsMessage")
                    .textContent = "";

            }, 800);


        }
        catch (e) {

            $("settingsMessage")
                .textContent =
                "❌ " +
                (
                    e.message ||
                    "Erreur"
                );

        }


        $("saveSettings")
            .disabled = false;

    };
