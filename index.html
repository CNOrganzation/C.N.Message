<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C.N. Message - Édition Cyber</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 15px; background: #05050a; color: #ffffff; display: flex; flex-direction: column; align-items: center; }
        .box { width: 100%; max-width: 500px; background: #0d0d1a; padding: 20px; border-radius: 12px; border: 2px solid #361FDB; box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); position: relative; box-sizing: border-box; }
        #ecran-connexion { display: block; }
        #ecran-chat { display: none; }
        #chat-box { height: 350px; border: 1px solid #361FDB; background: #020205; overflow-y: scroll; padding: 10px; margin-bottom: 15px; border-radius: 6px; }
        .message { display: flex; align-items: center; margin-bottom: 12px; padding: 8px; border-radius: 6px; background: #0b0b1e; border-left: 3px solid #00f0ff; line-height: 1.4; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; margin-right: 10px; border: 1.5px solid #00f0ff; background: #361FDB; }
        .pseudo-tag { font-weight: bold; color: #00f0ff; }
        .id-tag { font-size: 11px; color: #361FDB; font-style: italic; }
        .texte-tag { color: #e0e0ff; margin-left: 5px; }
        label { display: block; margin-top: 10px; color: #00f0ff; font-size: 14px; }
        input, button { padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #361FDB; margin-top: 5px; box-sizing: border-box; background: #05050a; color: white; -webkit-appearance: none; }
        input:focus { border-color: #00f0ff; outline: none; box-shadow: 0 0 5px #00f0ff; }
        .full-width { width: 100%; }
        #msg-input { width: 70%; border-color: #361FDB; display: inline-block; }
        #btn-envoi { width: 27%; background: #361FDB; color: white; border: none; cursor: pointer; float: right; font-weight: bold; }
        #btn-connexion { background: #002FA7; color: white; border: 1px solid #00f0ff; cursor: pointer; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h2 style="color: #00f0ff; text-shadow: 0 0 8px #361FDB; margin-bottom: 10px;">💬 C.N. Message</h2>

    <div id="ecran-connexion" class="box">
        <h3 style="color: #ffffff; margin-top: 0;">Créer ton Profil Cyber</h3>
        <label for="pseudo-input">Ton Pseudo :</label>
        <input type="text" id="pseudo-input" class="full-width" placeholder="Ex: Alexis, Alpha..." autocapitalize="none" autocomplete="off" autocorrect="off">
        <button id="btn-connexion" class="full-width" onclick="creerCompte()">Initialiser la connexion</button>
    </div>

    <div id="ecran-chat" class="box">
        <div style="display: flex; align-items: center; margin-bottom: 10px;">
            <img id="mon-avatar-header" class="avatar" src="https://flaticon.com" alt="">
            <p style="margin: 0;">ID réseau : <span id="afficher-profil" style="font-weight: bold; color: #00f0ff;"></span></p>
        </div>
        <div id="chat-box"></div>
        <div style="width: 100%; clear: both;">
            <input type="text" id="msg-input" placeholder="Écris ton message...">
            <button id="btn-envoi" onclick="envoyerMessage()">Envoyer</button>
        </div>
    </div>

    <script>
        var monPseudo = "";
        var monIdChiffres = "";

        function creerCompte() {
            var pseudoSaisi = document.getElementById("pseudo-input").value.trim();
            if (pseudoSaisi === "") {
                alert("Pseudo obligatoire !");
                return;
            }
            monPseudo = pseudoSaisi;
            monIdChiffres = Math.floor(100000 + Math.random() * 900000).toString();

            document.getElementById("ecran-connexion").style.display = "none";
            document.getElementById("ecran-chat").style.display = "block";
            document.getElementById("afficher-profil").innerText = monPseudo + " #" + monIdChiffres;
        }

        function envoyerMessage() {
            var msgInput = document.getElementById("msg-input");
            var texte = msgInput.value.trim();
            if (texte !== "") {
                var divMessage = document.createElement("div");
                divMessage.classList.add("message");
                divMessage.innerHTML = '<div><span class="pseudo-tag">' + monPseudo + '</span> <span class="id-tag">#' + monIdChiffres + '</span> : <span class="texte-tag">' + texte + '</span></div>';
                
                var chatBox = document.getElementById("chat-box");
                chatBox.appendChild(divMessage);
                chatBox.scrollTop = chatBox.scrollHeight;
                msgInput.value = "";
            }
        }
    </script>
</body>
</html>
